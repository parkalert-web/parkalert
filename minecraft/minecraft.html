<html lang="fr">

<title>Minecraft JS — un bac à sable de voxels dans le navigateur</title>
<meta name="description" content="Recréation de Minecraft en JavaScript : monde infini généré par bruit de Perlin, lumière dynamique, artisanat, créatures, survie et mode créatif. Un seul fichier, aucune dépendance."/>
<meta name="theme-color" content="#1a1a1a"/>

<!--
  Minecraft JS — fichier unique, engendré par minecraft/build.mjs.
  Ne pas modifier ici : les sources sont dans minecraft/src/.
  Aucune dépendance, aucune image, aucun son : les textures sont peintes au
  démarrage et les bruitages synthétisés par Web Audio.

<style>
/**
 * Minecraft JS — habillage.
 * Boutons biseautés, panneaux en pierre, texte pixelisé : l'esprit du jeu
 * d'origine, sans aucune image (tout est en dégradés et bordures).
 */

:root {
  --slot: 46px;
  --panel: #c6c6c6;
  --panel-dark: #8b8b8b;
  --panel-light: #ffffff;
  --slot-bg: #8b8b8b;
  --slot-dark: #373737;
  --text: #efefef;
  --btn: #6e6e6e;
  --btn-hi: #8b8b8b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: #0b0d12;
  color: var(--text);
  font-family: 'Trebuchet MS', 'Lucida Sans', system-ui, sans-serif;
  -webkit-font-smoothing: none;
  user-select: none;
}

#game {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  outline: none;
  cursor: crosshair;
  image-rendering: pixelated;
}

#ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#ui > * { pointer-events: auto; }

/* Ces couches recouvrent l'écran : elles doivent laisser passer la souris,
   sinon elles avalent les clics destinés au monde ou aux inventaires.
   La règle ci-dessus porte un identifiant : il faut la même force pour
   la contredire, d'où les sélecteurs préfixés par #ui. */
#ui > .hud,
#ui > .cursor-stack,
#ui > .vignette { pointer-events: none; }
/* …sauf la barre d'action, où l'on choisit son objet au clic. */
#ui .hotbar { pointer-events: auto; }
.hidden { display: none !important; }

/* ─────────────────────────────── ATH ─────────────────────────────── */

.hud { position: absolute; inset: 0; pointer-events: none; }

.crosshair {
  position: absolute; left: 50%; top: 50%;
  width: 20px; height: 20px; margin: -10px 0 0 -10px;
  background:
    linear-gradient(#fff, #fff) center/2px 20px no-repeat,
    linear-gradient(#fff, #fff) center/20px 2px no-repeat;
  mix-blend-mode: difference;
  opacity: .85;
}

.hud-bottom {
  position: absolute; left: 50%; bottom: 12px;
  transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}

.stat-rows { display: flex; flex-direction: column; gap: 2px; width: 100%; }
.stat-row { display: flex; justify-content: center; gap: 1px; min-height: 0; }
.stat-split { justify-content: space-between; width: 100%; }
.stat-group { display: flex; gap: 1px; }
.stat-group.right { flex-direction: row-reverse; }
.icon { width: 18px; height: 18px; image-rendering: pixelated; }

.xp-wrap { position: relative; width: 100%; display: flex; justify-content: center; }
.xp-bar {
  width: 100%; height: 8px;
  background: #1c1c1c; border: 1px solid #000;
  box-shadow: inset 0 1px 0 #ffffff22;
}
#xp-fill { height: 100%; background: linear-gradient(#a8f04a, #57c714); width: 0; }
#xp-level {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  color: #7bff3a; font-weight: bold; font-size: 15px;
  text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
}

.hotbar {
  display: flex; gap: 2px; padding: 3px;
  background: #0000005c; border: 2px solid #1a1a1acc;
}

.slot {
  position: relative;
  width: var(--slot); height: var(--slot);
  background: var(--slot-bg);
  border: 2px solid;
  border-color: var(--slot-dark) var(--panel-light) var(--panel-light) var(--slot-dark);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.hotbar-slot { cursor: default; }
.hotbar-slot.selected { outline: 3px solid #fff; outline-offset: 1px; z-index: 2; }
.slot-icon { width: 82%; height: 82%; image-rendering: pixelated; pointer-events: none; }
.slot-count {
  position: absolute; right: 2px; bottom: 0;
  font-size: 14px; font-weight: bold; color: #fff;
  text-shadow: 2px 2px 0 #3f3f3f;
}
.durability {
  position: absolute; left: 3px; right: 3px; bottom: 3px; height: 4px;
  background: #000;
}
.durability-fill { height: 100%; }

.item-name {
  position: absolute; left: 50%; bottom: 128px; transform: translateX(-50%);
  font-size: 18px; text-shadow: 2px 2px 0 #000;
  opacity: 0; transition: opacity .4s; white-space: nowrap;
}
.item-name.show { opacity: 1; }

.messages {
  position: absolute; left: 12px; bottom: 130px;
  display: flex; flex-direction: column; gap: 2px; max-width: 46%;
}
.message {
  background: #00000066; padding: 2px 8px; font-size: 14px;
  text-shadow: 1px 1px 0 #000;
}
.message.system { color: #ffd97a; }

.hint {
  position: absolute; left: 50%; top: 58%; transform: translateX(-50%);
  background: #00000070; padding: 4px 12px; font-size: 14px;
  opacity: 0; transition: opacity .2s;
}
.hint.show { opacity: 1; }

.debug {
  position: absolute; left: 8px; top: 8px;
  background: #00000088; padding: 6px 10px;
  font-family: 'Courier New', monospace; font-size: 13px; line-height: 1.45;
  text-shadow: 1px 1px 0 #000; pointer-events: none;
}

.vignette { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .12s; }

/* ───────────────────────────── Écrans ───────────────────────────── */

.overlay {
  position: fixed; inset: 0; z-index: 20;
  background: #0e0e12b0;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
  overflow: auto;
}

.panel {
  background: var(--panel);
  color: #1c1c1c;
  border: 4px solid;
  border-color: var(--panel-light) #555 #555 var(--panel-light);
  padding: 14px 18px 18px;
  box-shadow: 0 12px 40px #000a;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  max-width: min(96vw, 760px);
}

.panel-title {
  font-size: 20px; font-weight: bold; color: #2b2b2b;
  align-self: flex-start; letter-spacing: .5px;
}
.panel-hint { font-size: 12px; color: #4b4b4b; margin-top: 4px; text-align: center; }
.small-label { font-size: 12px; color: #3d3d3d; margin-bottom: 4px; }

.slot-grid { display: grid; gap: 2px; }
.hotbar-grid { margin-top: 8px; }
.player-inv { display: flex; flex-direction: column; align-items: center; }

.inv-top { display: flex; gap: 18px; align-items: flex-start; width: 100%; justify-content: center; }
.armor-col { display: flex; flex-direction: column; gap: 2px; }
.armor-slot { background: #7a7a7a; }
.doll {
  width: 90px; height: 190px; background: #555; border: 2px solid #3b3b3b;
  display: flex; align-items: center; justify-content: center;
}
.doll-figure {
  width: 44px; height: 120px;
  background:
    linear-gradient(#9c6b4b 0 26%, #3f6f9e 26% 62%, #2f4f7a 62% 100%);
  box-shadow: inset 0 0 0 2px #00000033;
  position: relative;
}
.doll-figure::before, .doll-figure::after {
  content: ''; position: absolute; top: 27%; width: 11px; height: 46%;
  background: #9c6b4b;
}
.doll-figure::before { left: -11px; }
.doll-figure::after { right: -11px; }

.craft-box { display: flex; flex-direction: column; }
.craft-row { display: flex; align-items: center; gap: 12px; }
.craft-row.big { margin: 6px 0; }
.arrow { font-size: 24px; color: #4b4b4b; }
.result-slot { background: #a5a5a5; }

.furnace-box { display: flex; align-items: center; gap: 16px; margin: 8px 0; }
.furnace-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.flame { width: 22px; height: 26px; background: #6b6b6b; border: 2px solid #4a4a4a; display: flex; align-items: flex-end; }
.flame-fill { width: 100%; background: linear-gradient(#ffd23a, #ff7a18); height: 0%; }
.furnace-progress { width: 90px; height: 16px; background: #6b6b6b; border: 2px solid #4a4a4a; }
.progress-fill { height: 100%; background: linear-gradient(#efefef, #c8c8c8); width: 0; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; align-self: flex-start; }
.tab {
  font: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer;
  background: var(--btn); color: #fff; border: 2px solid;
  border-color: var(--btn-hi) #3b3b3b #3b3b3b var(--btn-hi);
}
.tab.active { background: #4b7f3a; }

.creative-list {
  display: grid; grid-template-columns: repeat(9, var(--slot)); gap: 2px;
  max-height: 44vh; overflow-y: auto; padding: 4px;
  background: #8b8b8b; border: 2px solid #5a5a5a;
}

.cursor-stack {
  position: fixed; z-index: 40; width: var(--slot); height: var(--slot);
  transform: translate(-50%, -50%); pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}

.tooltip {
  position: fixed; z-index: 50; pointer-events: none;
  background: #17081fee; border: 2px solid #4b17a1;
  padding: 6px 10px; color: #fff; font-size: 13px; max-width: 220px;
}
.tip-title { font-weight: bold; margin-bottom: 3px; }
.tip-line { color: #a9a9c8; font-size: 12px; }
.tip-line.dim { color: #7a7a92; }

/* ───────────────────────────── Boutons ───────────────────────────── */

.btn {
  font: inherit; font-size: 15px; padding: 9px 22px; cursor: pointer;
  color: #fff; text-shadow: 2px 2px 0 #00000090;
  background: var(--btn);
  border: 2px solid;
  border-color: var(--btn-hi) #2f2f2f #2f2f2f var(--btn-hi);
  min-width: 180px;
}
.btn:hover { background: #7f8f6e; border-color: #a0b08d #33402c #33402c #a0b08d; }
.btn:active { border-color: #2f2f2f var(--btn-hi) var(--btn-hi) #2f2f2f; }
.btn.big { font-size: 17px; padding: 12px 28px; min-width: 300px; }
.btn.small { min-width: 92px; padding: 6px 12px; font-size: 13px; }
.btn.danger:hover { background: #9e3a3a; border-color: #c46a6a #4a1c1c #4a1c1c #c46a6a; }

/* ──────────────────────────── Menu principal ──────────────────────────── */

.menu {
  position: fixed; inset: 0; z-index: 30;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(120% 80% at 50% 0%, #4a7fc8 0%, #1d2b4a 55%, #0b0d12 100%);
  overflow: auto;
}
.menu::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(#00000022 1px, transparent 1px),
    linear-gradient(90deg, #00000022 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(#0000, #000 70%);
  pointer-events: none;
}

.menu-screen {
  position: relative;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding: 32px 20px; width: min(760px, 94vw);
}

.logo { text-align: center; line-height: 1; margin-bottom: 6px; }
.logo-main {
  display: block; font-size: clamp(38px, 8vw, 74px); font-weight: bold;
  letter-spacing: 3px; color: #b9c9a8;
  text-shadow: 4px 4px 0 #2b3a26, 0 0 26px #00000060;
}
.logo-sub { display: block; margin-top: 8px; font-size: 15px; color: #c8d6e8; letter-spacing: 2px; }

.menu-buttons { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.menu-buttons.row { flex-direction: row; flex-wrap: wrap; justify-content: center; }
.menu-title { font-size: 26px; text-shadow: 2px 2px 0 #000; }

.splash {
  color: #ffe24a; font-size: 15px; transform: rotate(-8deg);
  text-shadow: 2px 2px 0 #3b3000;
}

.world-list {
  width: 100%; max-height: 46vh; overflow-y: auto;
  background: #00000055; border: 2px solid #ffffff1a; padding: 6px;
  display: flex; flex-direction: column; gap: 4px;
}
.world-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px; background: #ffffff0e; border: 1px solid #ffffff14;
}
.world-row:hover { background: #ffffff1c; }
.world-name { font-size: 16px; }
.world-meta { font-size: 12px; color: #a8b6c8; margin-top: 3px; }
.world-actions { display: flex; gap: 6px; }
.empty { padding: 22px; text-align: center; color: #a8b6c8; }

.form { display: flex; flex-direction: column; gap: 14px; width: min(460px, 90vw); }
.form label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.form label.check { flex-direction: row; align-items: center; gap: 8px; }
.field {
  font: inherit; font-size: 15px; padding: 9px 10px;
  background: #000000aa; color: #fff;
  border: 2px solid #a0a0a0;
}
.field:focus { outline: none; border-color: #ffffff; }
input[type=range] { accent-color: #6aa84f; }

.about { max-width: 620px; display: flex; flex-direction: column; gap: 12px; line-height: 1.6; font-size: 15px; }
.about .dim { color: #9fb0c4; font-size: 13px; }

.loading { gap: 22px; }
.progress { width: min(460px, 88vw); height: 14px; background: #00000088; border: 2px solid #ffffff33; }
.progress .progress-fill { background: linear-gradient(#8fe04a, #4b9e28); transition: width .18s; }
.loading-tip { color: #c8d6e8; font-size: 14px; }

.pause .panel-menu, .death .panel-menu {
  background: #2b2b2bd8; color: #fff; border-color: #6b6b6b #1a1a1a #1a1a1a #6b6b6b;
  min-width: 340px; padding: 24px;
}
.panel-menu .panel-title { color: #fff; align-self: center; }
.pause-info { font-size: 12px; color: #b8b8b8; margin-top: 6px; }
.death-title { color: #ff5a5a; }
.death-cause, .death-score { font-size: 14px; color: #ddd; text-align: center; }

.keys { border-collapse: collapse; font-size: 14px; color: #eee; }
.keys td { padding: 4px 14px 4px 0; }
.keys td:first-child { color: #ffd97a; white-space: nowrap; }

.chat-box {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
  background: #00000099; padding: 6px;
}
.chat-input {
  width: 100%; font: inherit; font-size: 15px; padding: 8px 10px;
  background: #000000cc; color: #fff; border: 1px solid #ffffff44;
}
.chat-input:focus { outline: none; border-color: #fff; }

@media (max-width: 720px) {
  :root { --slot: 38px; }
  .creative-list { grid-template-columns: repeat(7, var(--slot)); }
  .inv-top { flex-wrap: wrap; }
  .doll { display: none; }
}

/* Invite à cliquer quand le navigateur n'a pas encore capturé la souris. */
.click-to-play {
  position: fixed; inset: 0; z-index: 18;
  display: flex; align-items: center; justify-content: center;
  background: #0b0d1255; cursor: pointer;
}
.ctp-box {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 18px 34px; font-size: 22px;
  background: #000000aa; border: 2px solid #ffffff33;
  text-shadow: 2px 2px 0 #000;
}
.ctp-box span { font-size: 13px; color: #b9c6d8; }

</style>
</head>

tex('water', (p) => waterFrame(p, 0), {
  frames: 16,
  drawFrame: (p, t) => waterFrame(p, t),
});
function waterFrame(p, t) {
  for (let y = 0; y < TILE; y++) {
    for (let x = 0; x < TILE; x++) {
      const w = Math.sin((x / 16 + t) * Math.PI * 2) * 0.5 + Math.sin((y / 16 - t * 1.4) * Math.PI * 4) * 0.5;
      const b = 150 + w * 22;
      const g = 100 + w * 20;
      p.px(x, y, [30, g | 0, b | 0, 190]);
    }
  }
  p.grain(6);
}

tex('lava', (p) => lavaFrame(p, 0), {
  frames: 16,
  drawFrame: (p, t) => lavaFrame(p, t),
});
function lavaFrame(p, t) {
  for (let y = 0; y < TILE; y++) {
    for (let x = 0; x < TILE; x++) {
      const w = Math.sin((x / 16 + t) * Math.PI * 2) * 0.5 + Math.sin((y / 16 + t * 2) * Math.PI * 6) * 0.5
        + Math.sin(((x + y) / 16 - t * 3) * Math.PI * 2) * 0.4;
      const r = 210 + w * 45;
      const g = 70 + w * 60;
      p.px(x, y, [Math.min(255, r) | 0, Math.max(0, g) | 0, 12, 255]);
    }
  }
  p.grain(10);
}

for (let s = 0; s < 10; s++) {
  tex(`destroy_${s}`, (p) => {
    const cracks = s + 1;
    const rng = mulberry32(1234);
    for (let c = 0; c < cracks * 2; c++) {
      let x = (rng() * TILE) | 0, y = (rng() * TILE) | 0;
      const len = 3 + ((rng() * (2 + s * 1.5)) | 0);
      for (let k = 0; k < len; k++) {
        p.px(x, y, '#000000cc');
        p.px(x + 1, y, '#00000055');
        x += ((rng() * 3) | 0) - 1;
        y += ((rng() * 3) | 0) - 1;
        if (x < 0 || x > 15 || y < 0 || y > 15) break;
      }
    }
  });
}

  { name: 'taiga', label: 'Taïga', top: ID.grass_block, filler: ID.dirt, grass: [0x86, 0xb7, 0x83], foliage: [0x68, 0xa4, 0x64], trees: 0.06, plants: 0.14, tree: 'spruce', mushrooms: true },
  { name: 'desert', cane: true, label: 'Désert', top: ID.sand, filler: ID.sandstone, grass: [0xbf, 0xb7, 0x55], foliage: [0xae, 0xa4, 0x2a], trees: 0.002, plants: 0.02, tree: 'cactus', dead: true },
  { name: 'mountains', label: 'Montagnes', top: ID.grass_block, filler: ID.dirt, grass: [0x8a, 0xb6, 0x89], foliage: [0x6d, 0xa4, 0x6a], trees: 0.006, plants: 0.1, tree: 'spruce' },
  { name: 'snowy', label: 'Toundra enneigée', top: ID.snow_block, filler: ID.dirt, grass: [0x80, 0xb4, 0x97], foliage: [0x60, 0xa1, 0x7b], trees: 0.008, plants: 0.03, tree: 'spruce', snow: true },
  { name: 'jungle', label: 'Jungle', top: ID.grass_block, filler: ID.dirt, grass: [0x59, 0xc9, 0x3c], foliage: [0x30, 0xbb, 0x0b], trees: 0.065, plants: 0.45, tree: 'jungle', vines: true, mushrooms: true, cane: true },
  { name: 'savanna', cane: true, label: 'Savane', top: ID.grass_block, filler: ID.dirt, grass: [0xbf, 0xb7, 0x55], foliage: [0xae, 0xa4, 0x2a], trees: 0.014, plants: 0.3, tree: 'acacia' },
  { name: 'swamp', label: 'Marais', top: ID.grass_block, filler: ID.dirt, grass: [0x6a, 0x70, 0x39], foliage: [0x6a, 0x70, 0x39], trees: 0.03, plants: 0.35, tree: 'oak', vines: true, mushrooms: true, cane: true, swamp: true },
  { name: 'badlands', label: 'Badlands', top: ID.red_sand, filler: ID.terracotta, grass: [0x90, 0x81, 0x4d], foliage: [0x9e, 0x81, 0x4d], trees: 0.004, plants: 0.06, tree: 'cactus', dead: true, mesa: true },
];

/** Couleur de la strate de terre cuite à une altitude donnée (badlands). */
function mesaLayer(y) {
  const m = ((y % 23) + 23) % 23;
  if (m === 3 || m === 4 || m === 14) return ID.terracotta_orange;
  if (m === 8 || m === 17 || m === 18) return ID.terracotta_white;
  if (m === 11 || m === 21) return ID.terracotta_yellow;
  return ID.terracotta;
}

const BIOME_ID = {};
BIOMES.forEach((b, i) => { BIOME_ID[b.name] = i; });

class WorldGen {
  constructor(seed) {
    this.seed = seed | 0;
    this.nContinent = new Noise(seed + 1);
    this.nHills = new Noise(seed + 2);
    this.nMountain = new Noise(seed + 3);
    this.nTemp = new Noise(seed + 4);
    this.nHum = new Noise(seed + 5);
    this.nCave = new Noise(seed + 6);
    this.nCave2 = new Noise(seed + 7);
    this.nCavern = new Noise(seed + 8);
    this.nDirt = new Noise(seed + 9);
    this.nStoneType = new Noise(seed + 10);
  }

  /** Altitude du sol et biome d'une colonne du monde. */
  column(wx, wz) {
    const cont = this.nContinent.fbm2(wx / 900, wz / 900, 4);
    const hills = this.nHills.fbm2(wx / 190, wz / 190, 4);
    const ridge = this.nMountain.ridged2(wx / 420, wz / 420, 4);
    const temp = this.nTemp.fbm2(wx / 1100 + 30, wz / 1100 - 12, 3);
    const hum = this.nHum.fbm2(wx / 850 - 40, wz / 850 + 25, 3);

    let h = SEA_LEVEL + cont * 26 + hills * 7;
    const mountainMask = Math.max(0, Math.min(1, (ridge - 0.15) / 0.6)) * Math.max(0, Math.min(1, (cont + 0.1) * 3));
    h += mountainMask * 46;
    h = Math.round(h);

    let biome;
    if (h < SEA_LEVEL - 2) biome = BIOME_ID.ocean;
    else if (h <= SEA_LEVEL + 1) biome = BIOME_ID.beach;
    else if (h > SEA_LEVEL + 30) biome = BIOME_ID.mountains;
    else if (temp < -0.16) biome = hum > -0.05 ? BIOME_ID.taiga : BIOME_ID.snowy;
    else if (temp > 0.26 && hum < -0.02) biome = BIOME_ID.badlands;
    else if (temp > 0.16 && hum < 0.06) biome = BIOME_ID.desert;
    else if (temp > 0.04 && hum > 0.19) biome = BIOME_ID.jungle;
    else if (temp > 0.05 && hum >= 0.05 && hum <= 0.17) biome = BIOME_ID.savanna;
    else if (hum > 0.11 && h < SEA_LEVEL + 7) biome = BIOME_ID.swamp;
    else if (hum > 0.14) biome = temp > 0.02 ? BIOME_ID.forest : BIOME_ID.birch_forest;
    else if (hum > 0.02) biome = BIOME_ID.forest;
    else biome = BIOME_ID.plains;

    // Le marais est plat et gorgé d'eau ; les badlands montent en plateaux.
    if (biome === BIOME_ID.swamp) {
      // Terrain plat, criblé de mares : sans elles, un marais n'en est pas un.
      const plat = SEA_LEVEL + Math.round((h - SEA_LEVEL) * 0.25);
      const mare = this.nDirt.perlin2(wx / 27 + 90, wz / 27 - 40);
      h = plat + (mare > 0.1 ? -2 : 0);
    }
    else if (biome === BIOME_ID.badlands) h = SEA_LEVEL + 4 + Math.round((h - SEA_LEVEL) * 1.15);

    return { h, biome, temp, hum, mountainMask };
  }

  /** Densité de grotte : true = on creuse. */
  isCave(wx, y, wz, surface) {
    if (y < 2 || y > surface - 2) return false;
    const t1 = this.nCave.perlin3(wx / 46, y / 26, wz / 46);
    const t2 = this.nCave2.perlin3((wx + 1200) / 46, y / 26, (wz - 800) / 46);
    if (t1 * t1 + t2 * t2 < 0.0035) return true;
    if (y < 40) {
      const cav = this.nCavern.perlin3(wx / 60, y / 36, wz / 60);
      if (cav > 0.46) return true;
    }
    return false;
  }

  /** Remplit les blocs d'un tronçon (relief, grottes, filons, eau). */
  generate(chunk) {
    const { blocks, height, biome: biomeArr } = chunk;
    const baseX = chunk.cx * CX, baseZ = chunk.cz * CZ;
    const surfaces = new Int16Array(CX * CZ);

    for (let z = 0; z < CZ; z++) {
      for (let x = 0; x < CX; x++) {
        const wx = baseX + x, wz = baseZ + z;
        const col = this.column(wx, wz);
        const b = BIOMES[col.biome];
        biomeArr[x + z * CX] = col.biome;
        surfaces[x + z * CX] = col.h;

        const dirtDepth = 3 + Math.round(this.nDirt.perlin2(wx / 24, wz / 24) * 2);
        let stoneVar = 0;
        for (let y = 0; y <= Math.max(col.h, SEA_LEVEL); y++) {
          let id = 0;
          if (y === 0) id = ID.bedrock;
          else if (y <= 2 && hash3i(wx, y, wz, this.seed) < 0.6 - y * 0.2) id = ID.bedrock;
          else if (y > col.h) id = y <= SEA_LEVEL ? ID.water : 0;
          else if (y === col.h) id = col.h <= SEA_LEVEL + 1 && b.name !== 'desert' ? (col.h < SEA_LEVEL - 1 ? ID.gravel : ID.sand) : b.top;
          else if (b.mesa && y > col.h - 26) id = mesaLayer(y);
          else if (y > col.h - dirtDepth) id = b.filler;
          else {
            id = ID.stone;
            if ((y & 3) === 0) stoneVar = this.nStoneType.perlin3(wx / 30, y / 30, wz / 30);
            if (stoneVar > 0.42) id = ID.granite;
            else if (stoneVar < -0.44) id = ID.diorite;
            else if (stoneVar > 0.28 && stoneVar < 0.36) id = ID.andesite;
          }

          if (id && id !== ID.water && id !== ID.bedrock && this.isCave(wx, y, wz, col.h)) {
            id = y < 11 && hash3i(wx, y, wz, this.seed + 77) < 0.28 ? ID.lava : 0;
          }
          if (id) blocks[idx(x, y, z)] = id;
        }

        // Sable rouge en surface des badlands bas, terre cuite sur les hauteurs.
        if (b.mesa && col.h > SEA_LEVEL + 12) blocks[idx(x, col.h, z)] = mesaLayer(col.h);
        // Montagnes enneigées au-dessus de 88.
        if (col.h > 88 && b.top === ID.grass_block) blocks[idx(x, col.h, z)] = ID.snow_block;
        // Surface gelée dans la toundra.
        if (b.name === 'snowy' && col.h < SEA_LEVEL && blocks[idx(x, SEA_LEVEL, z)] === ID.water) {
          blocks[idx(x, SEA_LEVEL, z)] = ID.ice;
        }
        height[x + z * CX] = Math.max(col.h + 1, SEA_LEVEL + 1);
      }
    }

    this.ores(chunk);
    chunk.surfaces = surfaces;
    chunk.generated = true;
  }

  /** Filons de minerai : quelques amas par tronçon, profondeur et rareté à la Minecraft. */
  ores(chunk) {
    const rng = mulberry32((chunk.cx * 341873128 + chunk.cz * 132897987 + this.seed) >>> 0);
    const veins = [
      { id: ID.coal_ore, tries: 20, size: 12, min: 5, max: 110 },
      { id: ID.iron_ore, tries: 16, size: 8, min: 3, max: 68 },
      { id: ID.gold_ore, tries: 3, size: 7, min: 3, max: 34 },
      { id: ID.redstone_ore, tries: 5, size: 7, min: 2, max: 18 },
      { id: ID.diamond_ore, tries: 2, size: 6, min: 2, max: 16 },
      { id: ID.lapis_ore, tries: 2, size: 6, min: 3, max: 32 },
      { id: ID.emerald_ore, tries: 4, size: 2, min: 6, max: 96, mountainOnly: true },
      { id: ID.gravel, tries: 4, size: 24, min: 20, max: 70 },
      { id: ID.granite, tries: 3, size: 30, min: 5, max: 78 },
      { id: ID.andesite, tries: 3, size: 30, min: 5, max: 78 },
      { id: ID.diorite, tries: 3, size: 30, min: 5, max: 78 },
      { id: ID.dirt, tries: 4, size: 26, min: 10, max: 90 },
    ];
    for (const v of veins) {
      for (let t = 0; t < v.tries; t++) {
        const x0 = rng() * CX, z0 = rng() * CZ;
        const y0 = v.min + rng() * (v.max - v.min);
        if (v.mountainOnly) {
          const b = chunk.biome[(Math.min(15, x0 | 0)) + (Math.min(15, z0 | 0)) * CX];
          if (BIOMES[b].name !== 'mountains') continue;
        }
        const size = 2 + rng() * v.size;
        const rad = Math.cbrt(size) * 0.9;
        for (let dx = -rad; dx <= rad; dx++) {
          for (let dy = -rad; dy <= rad; dy++) {
            for (let dz = -rad; dz <= rad; dz++) {
              if (dx * dx + dy * dy + dz * dz > rad * rad) continue;
              const x = (x0 + dx) | 0, y = (y0 + dy) | 0, z = (z0 + dz) | 0;
              if (x < 0 || x >= CX || z < 0 || z >= CZ || y < 1 || y >= WORLD_H) continue;
              const i = idx(x, y, z);
              const cur = chunk.blocks[i];
              if (cur === ID.stone || cur === ID.granite || cur === ID.diorite || cur === ID.andesite) {
                chunk.blocks[i] = v.id;
              }
            }
          }
        }
      }
    }
  }

  /**
   * Décoration : arbres, fleurs, cactus, citrouilles.
   * Appelée quand le tronçon et ses voisins existent, pour que les arbres
   * débordent proprement d'un tronçon à l'autre.
   */
  populate(world, chunk) {
    for (let dz = -1; dz <= 1; dz++) {
      for (let dx = -1; dx <= 1; dx++) {
        this.featuresOf(world, chunk.cx + dx, chunk.cz + dz, chunk);
      }
    }
    this.structuresFor(chunk);
    chunk.populated = true;
  }

  /** Calcule les décors « appartenant » au tronçon (fcx,fcz) et n'écrit que dans `target`. */
  featuresOf(world, fcx, fcz, target) {
    const rng = mulberry32((fcx * 1013904223 + fcz * 1664525 + this.seed * 7919) >>> 0);
    const baseX = fcx * CX, baseZ = fcz * CZ;
    const put = (wx, wy, wz, id, force = false, data = 0) => {
      const lx = wx - target.cx * CX, lz = wz - target.cz * CZ;
      if (lx < 0 || lx >= CX || lz < 0 || lz >= CZ || wy < 0 || wy >= WORLD_H) return;
      const i = idx(lx, wy, lz);
      const cur = target.blocks[i];
      if (!force && cur !== 0 && cur !== ID.water) return;
      target.blocks[i] = id;
      if (data) target.setData(lx, wy, lz, data);
    };
    const groundAt = (wx, wz) => this.column(wx, wz);

    // Arbres
    for (let i = 0; i < 24; i++) {
      const wx = baseX + Math.floor(rng() * CX);
      const wz = baseZ + Math.floor(rng() * CZ);
      const col = groundAt(wx, wz);
      const b = BIOMES[col.biome];
      // `trees` est une probabilité par colonne : 24 tentatives sur 256 colonnes.
      if (!b.tree || rng() > b.trees * 10.7) continue;
      if (col.h <= SEA_LEVEL) continue;
      if (b.tree === 'cactus') this.cactus(put, wx, col.h + 1, wz, rng);
      else this.tree(put, wx, col.h + 1, wz, b.tree, rng, b.vines);
    }

    // Herbes, fleurs, champignons, citrouilles
    for (let i = 0; i < 40; i++) {
      const wx = baseX + Math.floor(rng() * CX);
      const wz = baseZ + Math.floor(rng() * CZ);
      const col = groundAt(wx, wz);
      const b = BIOMES[col.biome];
      if (col.h <= SEA_LEVEL) continue;
      const r = rng();
      if (r > b.plants * 3) continue;
      const y = col.h + 1;
      if (b.dead) { if (rng() < 0.5) put(wx, y, wz, ID.dead_bush); continue; }
      if (b.snow) { if (rng() < 0.3) put(wx, y, wz, ID.tall_grass); continue; }
      // Canne à sucre : uniquement les pieds dans l'eau, comme dans le jeu.
      if (b.cane && rng() < 0.35) {
        const bordDeau = [[1, 0], [-1, 0], [0, 1], [0, -1]]
          .some(([ox, oz]) => groundAt(wx + ox, wz + oz).h < SEA_LEVEL);
        if (bordDeau) {
          const h = 2 + Math.floor(rng() * 3);
          for (let k = 0; k < h; k++) put(wx, y + k, wz, ID.sugar_cane);
          continue;
        }
      }
      const q = rng();
      if (b.flowers && q < 0.12) put(wx, y, wz, ID.dandelion);
      else if (b.flowers && q < 0.2) put(wx, y, wz, ID.poppy);
      else if (b.mushrooms && q < 0.26) put(wx, y, wz, q < 0.23 ? ID.red_mushroom : ID.brown_mushroom);
      else if (q < 0.03) put(wx, y, wz, ID.pumpkin);
      else put(wx, y, wz, ID.tall_grass);
    }
  }

  /** Un arbre : tronc + houppier, forme dépendante de l'essence. */
  tree(put, x, y, z, kind, rng, vines = false) {
    const LOGS = { oak: ID.oak_log, birch: ID.birch_log, spruce: ID.spruce_log, jungle: ID.jungle_log, acacia: ID.acacia_log };
    const LEAVES = { oak: ID.oak_leaves, birch: ID.birch_leaves, spruce: ID.spruce_leaves, jungle: ID.jungle_leaves, acacia: ID.acacia_leaves };
    const logId = LOGS[kind] ?? ID.oak_log;
    const leafId = LEAVES[kind] ?? ID.oak_leaves;
    const feuilles = [];
    const poseFeuille = (fx, fy, fz) => { put(fx, fy, fz, leafId); feuilles.push([fx, fy, fz]); };

    if (kind === 'spruce') {
      const h = 7 + Math.floor(rng() * 5);
      for (let i = 0; i < h; i++) put(x, y + i, z, logId, true);
      for (let i = h - 1; i >= 2; i--) {
        const couche = h - 1 - i;
        const r = couche % 2 === 0 ? Math.min(3, 1 + Math.floor(couche / 2)) : Math.max(1, Math.floor(couche / 2));
        for (let dx = -r; dx <= r; dx++) {
          for (let dz = -r; dz <= r; dz++) {
            if (Math.abs(dx) + Math.abs(dz) > r + 1) continue;
            if (dx === 0 && dz === 0 && i < h) continue;
            poseFeuille(x + dx, y + i, z + dz);
          }
        }
      }
      poseFeuille(x, y + h, z);
      return;
    }

    if (kind === 'acacia') {
      // Tronc droit puis penché, houppier plat : la silhouette de la savane.
      const tronc = 4 + Math.floor(rng() * 2);
      for (let i = 0; i < tronc; i++) put(x, y + i, z, logId, true);
      const dx = rng() < 0.5 ? 1 : -1;
      const dz = rng() < 0.5 ? 1 : -1;
      const penche = rng() < 0.5;
      let cx = x, cz = z, cy = y + tronc;
      for (let i = 0; i < 3; i++) {
        if (penche) cx += dx; else cz += dz;
        put(cx, cy, cz, logId, true);
        cy++;
      }
      for (let ry = 0; ry < 2; ry++) {
        const r = ry === 0 ? 3 : 2;
        for (let ox = -r; ox <= r; ox++) {
          for (let oz = -r; oz <= r; oz++) {
            if (Math.abs(ox) + Math.abs(oz) > r + 1) continue;
            poseFeuille(cx + ox, cy - 1 + ry, cz + oz);
          }
        }
      }
      return;
    }

    if (kind === 'jungle') {
      // Grand fût nu et couronne haute, d'où pendent les lianes.
      const h = 9 + Math.floor(rng() * 6);
      for (let i = 0; i < h; i++) put(x, y + i, z, logId, true);
      for (let dy = h - 2; dy <= h + 1; dy++) {
        const r = dy >= h ? 2 : 3;
        for (let dx = -r; dx <= r; dx++) {
          for (let dz = -r; dz <= r; dz++) {
            if (dx * dx + dz * dz > r * r + 1) continue;
            if (dx === 0 && dz === 0 && dy < h) continue;
            if (Math.abs(dx) === r && Math.abs(dz) === r && rng() < 0.6) continue;
            poseFeuille(x + dx, y + dy, z + dz);
          }
        }
      }
      // Quelques lianes le long du tronc.
      for (let i = 3; i < h - 2; i++) {
        if (rng() < 0.35) {
          const [ox, oz, face] = DIRS4[(rng() * 4) | 0];
          put(x + ox, y + i, z + oz, ID.vine, false, face ^ 1);
        }
      }
      this.vines(put, feuilles, rng);
      return;
    }

    const h = (kind === 'birch' ? 6 : 5) + Math.floor(rng() * 3);
    for (let i = 0; i < h; i++) put(x, y + i, z, logId, true);
    for (let dy = h - 3; dy <= h; dy++) {
      const r = dy >= h - 1 ? 1 : 2;
      for (let dx = -r; dx <= r; dx++) {
        for (let dz = -r; dz <= r; dz++) {
          if (dx === 0 && dz === 0 && dy < h) continue;
          if (Math.abs(dx) === r && Math.abs(dz) === r && (rng() < 0.5 || dy >= h - 1)) continue;
          poseFeuille(x + dx, y + dy, z + dz);
        }
      }
    }
    if (vines) this.vines(put, feuilles, rng);
  }

  /** Rideaux de lianes accrochés sous le houppier. */
  vines(put, feuilles, rng) {
    for (const [fx, fy, fz] of feuilles) {
      if (rng() > 0.22) continue;
      const [ox, oz, face] = DIRS4[(rng() * 4) | 0];
      const longueur = 1 + Math.floor(rng() * 5);
      for (let k = 0; k < longueur; k++) put(fx + ox, fy - k, fz + oz, ID.vine, false, face ^ 1);
    }
  }

  cactus(put, x, y, z, rng) {
    const h = 1 + Math.floor(rng() * 3);
    for (let i = 0; i < h; i++) put(x, y + i, z, ID.cactus, true);
  }

  /* ─────────────────────────────── Structures ───────────────────────────────
     Chaque type occupe une « région » de N tronçons ; à l'intérieur, la graine
     décide s'il y a quelque chose et où. Un tronçon qui se génère consulte les
     régions voisines et ne dessine que la part qui le concerne : une maison à
     cheval sur deux tronçons est donc complète, quel que soit l'ordre. */

  /** Origines possibles d'un type de structure autour d'un tronçon. */
  *origines(type, cx, cz) {
    const st = STRUCTURES[type];
    const sel = STRUCTURE_SEL[type];
    const r = st.rayon;
    const r0x = Math.floor((cx - r) / st.espacement), r1x = Math.floor((cx + r) / st.espacement);
    const r0z = Math.floor((cz - r) / st.espacement), r1z = Math.floor((cz + r) / st.espacement);
    for (let rx = r0x; rx <= r1x; rx++) {
      for (let rz = r0z; rz <= r1z; rz++) {
        if (hash3i(rx, sel, rz, this.seed + 4242) > st.chance) continue;
        const ox = rx * st.espacement + Math.floor(hash3i(rx, sel + 1, rz, this.seed + 77) * st.espacement);
        const oz = rz * st.espacement + Math.floor(hash3i(rx, sel + 2, rz, this.seed + 91) * st.espacement);
        if (Math.abs(ox - cx) > r || Math.abs(oz - cz) > r) continue;
        yield { cx: ox, cz: oz, graine: (ox * 341873128 + oz * 132897987 + this.seed + sel * 7919) >>> 0 };
      }
    }
  }

  /** Outils d'écriture bornés au tronçon en cours. */
  outils(target) {
    const base = (wx, wz) => [wx - target.cx * CX, wz - target.cz * CZ];
    const dedans = (lx, lz, wy) => lx >= 0 && lx < CX && lz >= 0 && lz < CZ && wy >= 0 && wy < WORLD_H;
    const poser = (wx, wy, wz, id, force = true, data = 0) => {
      const [lx, lz] = base(wx, wz);
      if (!dedans(lx, lz, wy)) return;
      const i = idx(lx, wy, lz);
      if (!force && target.blocks[i] !== 0 && target.blocks[i] !== ID.water) return;
      target.blocks[i] = id;
      if (data) target.setData(lx, wy, lz, data);
      else if (target.data) target.data[i] = 0;
    };
    const coffre = (wx, wy, wz, data, butin) => {
      poser(wx, wy, wz, ID.chest, true, data);
      const [lx, lz] = base(wx, wz);
      if (!dedans(lx, lz, wy)) return;

    const pairs = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
    for (const [i, j] of pairs) {
      e.push(c[i][0] - 0.5, c[i][1] - 0.5, c[i][2] - 0.5, 0, 0, 1);
      e.push(c[j][0] - 0.5, c[j][1] - 0.5, c[j][2] - 0.5, 0, 0, 1);
    }
    this.lineVAO = gl.createVertexArray();
    gl.bindVertexArray(this.lineVAO);
    const lb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, lb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(e), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(a.aPos);
    gl.vertexAttribPointer(a.aPos, 3, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(a.aUV);
    gl.vertexAttribPointer(a.aUV, 2, gl.FLOAT, false, 24, 12);
    gl.enableVertexAttribArray(a.aShade);
    gl.vertexAttribPointer(a.aShade, 1, gl.FLOAT, false, 24, 20);
    this.lineCount = pairs.length * 2;

    // Tampon dynamique pour les particules et les billboards.
    this.dynVAO = gl.createVertexArray();
    gl.bindVertexArray(this.dynVAO);
    this.dynBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.dynBuf);
    gl.bufferData(gl.ARRAY_BUFFER, 6 * 4 * 4096, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(a.aPos);
    gl.vertexAttribPointer(a.aPos, 3, gl.FLOAT, false, 24, 0);
    gl.enableVertexAttribArray(a.aUV);
    gl.vertexAttribPointer(a.aUV, 2, gl.FLOAT, false, 24, 12);
    gl.enableVertexAttribArray(a.aShade);
    gl.vertexAttribPointer(a.aShade, 1, gl.FLOAT, false, 24, 20);
    this.dynData = new Float32Array(6 * 4096);

    gl.bindVertexArray(null);
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, this.maxDpr || 2);
    const w = Math.floor(this.canvas.clientWidth * dpr);
    const h = Math.floor(this.canvas.clientHeight * dpr);
    if (this.canvas.width !== w || this.canvas.height !== h) {
      this.canvas.width = Math.max(1, w);
      this.canvas.height = Math.max(1, h);
    }
    this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    return this.canvas.width / Math.max(1, this.canvas.height);
  }

  /* ─────────────────────── Maillages des tronçons ─────────────────────── */

  uploadMesh(chunk, mesh) {
    const gl = this.gl;
    let entry = this.meshes.get(chunk);
    if (!entry) { entry = { parts: {} }; this.meshes.set(chunk, entry); }

    for (const kind of ['opaque', 'cutout', 'water']) {
      const data = mesh[kind];
      let part = entry.parts[kind];
      if (!data) {
        if (part) { this.deletePart(part); delete entry.parts[kind]; }
        continue;
      }
      if (!part) {
        part = {
          vao: gl.createVertexArray(), b0: gl.createBuffer(), b1: gl.createBuffer(), ib: gl.createBuffer(),
        };
        gl.bindVertexArray(part.vao);
        gl.bindBuffer(gl.ARRAY_BUFFER, part.b0);
        gl.enableVertexAttribArray(this.terrain.a.aP0);
        gl.vertexAttribIPointer(this.terrain.a.aP0, 1, gl.UNSIGNED_INT, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, part.b1);
        gl.enableVertexAttribArray(this.terrain.a.aP1);
        gl.vertexAttribIPointer(this.terrain.a.aP1, 1, gl.UNSIGNED_INT, 0, 0);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, part.ib);
        entry.parts[kind] = part;
      }
      gl.bindVertexArray(part.vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, part.b0);
      gl.bufferData(gl.ARRAY_BUFFER, data.p0, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, part.b1);
      gl.bufferData(gl.ARRAY_BUFFER, data.p1, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, part.ib);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, data.index, gl.STATIC_DRAW);
      part.count = data.count;
      part.type = data.index instanceof Uint32Array ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;
    }
    entry.origin = mesh.origin;
    gl.bindVertexArray(null);
  }

  deletePart(part) {
    const gl = this.gl;
    gl.deleteVertexArray(part.vao);
    gl.deleteBuffer(part.b0);
    gl.deleteBuffer(part.b1);
    gl.deleteBuffer(part.ib);
  }

  freeChunk(chunk) {
    const entry = this.meshes.get(chunk);
    if (!entry) return;
    for (const part of Object.values(entry.parts)) this.deletePart(part);
    this.meshes.delete(chunk);
  }

  /* ──────────────────────────── Caméra et frustum ──────────────────────────── */

  setCamera(cam, aspect) {
    perspective(this.proj, cam.fov * Math.PI / 180, aspect, 0.06, 1200);
    viewMatrix(this.view, cam.x, cam.y, cam.z, cam.yaw, cam.pitch);
    multiply(this.viewProj, this.proj, this.view);
    invert(this.invVP, this.viewProj);
    this.extractFrustum();
    this.cam = cam;
  }

  extractFrustum() {
    const m = this.viewProj, f = this.frustum;
    // gauche, droite, bas, haut, proche, lointain
    const rows = [
      [m[3] + m[0], m[7] + m[4], m[11] + m[8], m[15] + m[12]],
      [m[3] - m[0], m[7] - m[4], m[11] - m[8], m[15] - m[12]],
      [m[3] + m[1], m[7] + m[5], m[11] + m[9], m[15] + m[13]],
      [m[3] - m[1], m[7] - m[5], m[11] - m[9], m[15] - m[13]],
      [m[3] + m[2], m[7] + m[6], m[11] + m[10], m[15] + m[14]],
      [m[3] - m[2], m[7] - m[6], m[11] - m[10], m[15] - m[14]],
    ];
    for (let i = 0; i < 6; i++) {
      const [a, b, c, d] = rows[i];
      const len = Math.hypot(a, b, c) || 1;
      f[i * 4] = a / len; f[i * 4 + 1] = b / len; f[i * 4 + 2] = c / len; f[i * 4 + 3] = d / len;
    }
  }

  boxVisible(x0, y0, z0, x1, y1, z1) {
    const f = this.frustum;
    for (let i = 0; i < 6; i++) {
      const a = f[i * 4], b = f[i * 4 + 1], c = f[i * 4 + 2], d = f[i * 4 + 3];
      const px = a > 0 ? x1 : x0, py = b > 0 ? y1 : y0, pz = c > 0 ? z1 : z0;
      if (a * px + b * py + c * pz + d < 0) return false;
    }
    return true;
  }

  /* ──────────────────────────────── Rendu ──────────────────────────────── */

  /** Couleurs du ciel selon l'heure et la météo. */
  skyColors(world) {
    const b = world.skyBrightness();
    const rain = world.weather === 'rain' ? 1 : 0;
    const day = [0.42, 0.62, 0.98];
    const night = [0.02, 0.03, 0.09];
    const dusk = [0.55, 0.36, 0.30];
    const sun = Math.sin(world.sunAngle());
    const duskAmt = Math.max(0, 1 - Math.abs(sun) * 3.2);
    const mix = (a, c, t) => a.map((v, i) => v + (c[i] - v) * t);
    let top = mix(night, day, Math.min(1, b * 1.15));
    top = mix(top, dusk, duskAmt * 0.55);
    let horizon = top.map((v, i) => Math.min(1, v * 1.12 + [0.10, 0.10, 0.06][i] * b));
    horizon = mix(horizon, [0.98, 0.62, 0.36], duskAmt * 0.6);
    if (rain) {
      top = mix(top, [0.30, 0.33, 0.38], 0.75);
      horizon = mix(horizon, [0.38, 0.40, 0.45], 0.75);
    }
    return { top, horizon, brightness: b, night: 1 - Math.min(1, b * 1.6) };
  }

  drawSky(world, camInWater) {
    const gl = this.gl;
    const c = this.skyColors(world);
    const fog = camInWater ? [0.06, 0.24, 0.44] : c.horizon;
    gl.clearColor(fog[0], fog[1], fog[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    if (camInWater) return c;

    gl.useProgram(this.sky.p);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    gl.bindVertexArray(this.quadVAO);
    gl.uniformMatrix4fv(this.sky.u.uInvVP, false, this.invVP);
    gl.uniform3f(this.sky.u.uCam, this.cam.x, this.cam.y, this.cam.z);
    gl.uniform3fv(this.sky.u.uTop, c.top);
    gl.uniform3fv(this.sky.u.uHorizon, c.horizon);
    const sd = world.sunDir();
    gl.uniform3fv(this.sky.u.uSunDir, sd);
    gl.uniform1f(this.sky.u.uNight, c.night);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.depthMask(true);
    gl.enable(gl.CULL_FACE);
    return c;
  }

  /** Soleil et lune, deux quadrilatères posés très loin dans le ciel. */
  drawCelestial(world) {
    const gl = this.gl;
    const sd = world.sunDir();
    gl.useProgram(this.simple.p);
    gl.depthMask(false);
    gl.disable(gl.CULL_FACE);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(this.cubeVAO);
    gl.uniformMatrix4fv(this.simple.u.uViewProj, false, this.viewProj);
    gl.uniform3f(this.simple.u.uCam, this.cam.x, this.cam.y, this.cam.z);
    gl.uniform1i(this.simple.u.uFogged, 0);
    gl.uniform1i(this.simple.u.uTextured, 1);
    gl.uniform1f(this.simple.u.uLight, 1);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.atlas);
    gl.uniform1i(this.simple.u.uAtlas, 0);

    for (const body of [{ dir: sd, layer: T('sun'), size: 60, color: [1, 1, 1, 1] },
      { dir: sd.map((v) => -v), layer: T('moon'), size: 42, color: [1, 1, 1, 1] }]) {
      const d = 420;
      composeMatrix(this.model, this.cam.x + body.dir[0] * d, this.cam.y + body.dir[1] * d, this.cam.z + body.dir[2] * d,
        0, 0, body.size, body.size, body.size);
      gl.uniformMatrix4fv(this.simple.u.uModel, false, this.model);
      gl.uniform1f(this.simple.u.uLayer, body.layer);
      gl.uniform4fv(this.simple.u.uColor, body.color);
      gl.drawElements(gl.TRIANGLES, this.cubeCount, gl.UNSIGNED_SHORT, 0);
    }
    gl.depthMask(true);
    gl.enable(gl.CULL_FACE);
    gl.disable(gl.BLEND);
  }

  /**
   * Dessine tous les tronçons visibles.
   * @param {object} world monde
   * @param {object} opts {camInWater, fogColor, day}
   */
  drawChunks(world, opts) {
    const gl = this.gl;
    const t = this.terrain;
    gl.useProgram(t.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.atlas);
    gl.uniform1i(t.u.uAtlas, 0);
    gl.uniformMatrix4fv(t.u.uViewProj, false, this.viewProj);
    gl.uniform3f(t.u.uCam, this.cam.x, this.cam.y, this.cam.z);
    gl.uniform1f(t.u.uDay, opts.day);
    gl.uniform3fv(t.u.uFogColor, opts.fogColor);
    gl.uniform1f(t.u.uFogNear, opts.fogNear);
    gl.uniform1f(t.u.uFogFar, opts.fogFar);
    gl.uniform1f(t.u.uAlpha, 1);

    // Tronçons visibles, triés du plus proche au plus lointain.
    const visible = [];
    for (const [chunk, entry] of this.meshes) {
      const x0 = chunk.cx * CX, z0 = chunk.cz * CZ;
      if (!this.boxVisible(x0, 0, z0, x0 + CX, WORLD_H, z0 + CZ)) continue;
      const dx = x0 + 8 - this.cam.x, dz = z0 + 8 - this.cam.z;
      visible.push({ entry, d: dx * dx + dz * dz });
    }
    visible.sort((a, b) => a.d - b.d);

    this.stats.chunks = visible.length;
    this.stats.quads = 0;
    let draws = 0;

    gl.uniform1i(t.u.uCutout, 0);
    for (const v of visible) {
      const part = v.entry.parts.opaque;
      if (!part || !part.count) continue;
      gl.uniform3fv(t.u.uOrigin, v.entry.origin);
      gl.bindVertexArray(part.vao);
      gl.drawElements(gl.TRIANGLES, part.count, part.type, 0);
      this.stats.quads += part.count / 6; draws++;
    }

    // Feuillages, plantes, verre : test alpha, pas de face arrière supprimée.
    gl.uniform1i(t.u.uCutout, 1);
    gl.disable(gl.CULL_FACE);
    for (const v of visible) {
      const part = v.entry.parts.cutout;
      if (!part || !part.count) continue;
      gl.uniform3fv(t.u.uOrigin, v.entry.origin);
      gl.bindVertexArray(part.vao);
      gl.drawElements(gl.TRIANGLES, part.count, part.type, 0);
      this.stats.quads += part.count / 6; draws++;
    }
    gl.enable(gl.CULL_FACE);
    this.stats.draws = draws;
    this.visibleChunks = visible;
  }

  /** L'eau passe en dernier, du plus lointain au plus proche, en transparence. */
  drawWater(opts) {
    const gl = this.gl;
    const t = this.terrain;
    if (!this.visibleChunks) return;
    gl.useProgram(t.p);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.CULL_FACE);
    gl.uniform1i(t.u.uCutout, 0);
    gl.uniform1f(t.u.uAlpha, 1);
    const list = [...this.visibleChunks].sort((a, b) => b.d - a.d);
    for (const v of list) {
      const part = v.entry.parts.water;
      if (!part || !part.count) continue;
      gl.uniform3fv(t.u.uOrigin, v.entry.origin);
      gl.bindVertexArray(part.vao);
      gl.drawElements(gl.TRIANGLES, part.count, part.type, 0);
    }
    gl.enable(gl.CULL_FACE);
    gl.disable(gl.BLEND);
  }

  /* ─────────────────────── Cubes, entités, particules ─────────────────────── */

  beginSimple(opts) {
    const gl = this.gl;
    gl.useProgram(this.simple.p);
    gl.uniformMatrix4fv(this.simple.u.uViewProj, false, this.viewProj);
    gl.uniform3f(this.simple.u.uCam, this.cam.x, this.cam.y, this.cam.z);
    gl.uniform3fv(this.simple.u.uFogColor, opts.fogColor);
    gl.uniform1f(this.simple.u.uFogNear, opts.fogNear);
    gl.uniform1f(this.simple.u.uFogFar, opts.fogFar);
    gl.uniform1i(this.simple.u.uFogged, 1);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, this.atlas);
    gl.uniform1i(this.simple.u.uAtlas, 0);
  }

  /** Un pavé texturé ou uni, orienté par yaw/pitch. */
  drawBox(px, py, pz, sx, sy, sz, yaw, pitch, color, layer, light) {
    const gl = this.gl;
    composeMatrix(this.model, px, py, pz, yaw, pitch, sx, sy, sz);
    gl.bindVertexArray(this.cubeVAO);
    gl.uniformMatrix4fv(this.simple.u.uModel, false, this.model);
    gl.uniform4fv(this.simple.u.uColor, color);
    gl.uniform1f(this.simple.u.uLight, light);
    gl.uniform1i(this.simple.u.uTextured, layer >= 0 ? 1 : 0);
    if (layer >= 0) gl.uniform1f(this.simple.u.uLayer, layer);
    gl.drawElements(gl.TRIANGLES, this.cubeCount, gl.UNSIGNED_SHORT, 0);
  }

  /** Matrice déjà composée (parties de créature attachées à un corps). */
  drawBoxMatrix(m, color, layer, light) {
    const gl = this.gl;
    gl.bindVertexArray(this.cubeVAO);
    gl.uniformMatrix4fv(this.simple.u.uModel, false, m);
    gl.uniform4fv(this.simple.u.uColor, color);
    gl.uniform1f(this.simple.u.uLight, light);
    gl.uniform1i(this.simple.u.uTextured, layer >= 0 ? 1 : 0);
    if (layer >= 0) gl.uniform1f(this.simple.u.uLayer, layer);
    gl.drawElements(gl.TRIANGLES, this.cubeCount, gl.UNSIGNED_SHORT, 0);
  }

  /** Contour blanc du bloc visé. */
  drawOutline(x, y, z) {
    const gl = this.gl;
    gl.bindVertexArray(this.lineVAO);
    composeMatrix(this.model, x + 0.5, y + 0.5, z + 0.5, 0, 0, 1.002, 1.002, 1.002);
    gl.uniformMatrix4fv(this.simple.u.uModel, false, this.model);
    gl.uniform4f(this.simple.u.uColor, 0, 0, 0, 0.55);
    gl.uniform1i(this.simple.u.uTextured, 0);
    gl.uniform1f(this.simple.u.uLight, 1);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.drawArrays(gl.LINES, 0, this.lineCount);
    gl.disable(gl.BLEND);
  }

  /** Fissures progressives sur le bloc en cours de cassage. */
  drawBreak(x, y, z, progress) {
    const gl = this.gl;
    const stage = Math.min(9, Math.max(0, Math.floor(progress * 10)));
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthFunc(gl.LEQUAL);
    this.drawBox(x + 0.5, y + 0.5, z + 0.5, 1.004, 1.004, 1.004, 0, 0, [1, 1, 1, 1], T(`destroy_${stage}`), 1);
    gl.disable(gl.BLEND);
  }

  /** Particules : petits quadrilatères face caméra, dessinés en un seul appel. */
  drawParticles(list, yaw) {
    if (!list.length) return;
    const gl = this.gl;
    const cy = Math.cos(-yaw), sy = Math.sin(-yaw);
    let n = 0;
    const d = this.dynData;
    for (const p of list) {
      if (n + 6 > 4096) break;
      const s = p.size * 0.5;
      const corners = [[-s, -s], [s, -s], [s, s], [-s, -s], [s, s], [-s, s]];
      const uv = [[0, 1], [1, 1], [1, 0], [0, 1], [1, 0], [0, 0]];
      for (let i = 0; i < 6; i++) {
        const [ox, oy] = corners[i];
        const wx = p.x + ox * cy, wz = p.z - ox * sy;
        const o = n * 6;
        d[o] = wx; d[o + 1] = p.y + oy; d[o + 2] = wz;
        d[o + 3] = uv[i][0] * (p.uvScale ?? 1) + (p.uvOffX ?? 0);
        d[o + 4] = uv[i][1] * (p.uvScale ?? 1) + (p.uvOffY ?? 0);
        d[o + 5] = p.light ?? 1;
        n++;
      }
    }
    gl.bindVertexArray(this.dynVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.dynBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, d.subarray(0, n * 6));
    identity(this.model);
    gl.uniformMatrix4fv(this.simple.u.uModel, false, this.model);
    gl.uniform1i(this.simple.u.uTextured, 1);
    gl.uniform1f(this.simple.u.uLight, 1);
    gl.uniform4f(this.simple.u.uColor, 1, 1, 1, 1);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.CULL_FACE);
    // Une couche par particule : on regroupe par texture.
    let start = 0;
    let curLayer = list.length ? list[0].layer : 0;
    const flush = (from, to, layer) => {
      if (to <= from) return;
      gl.uniform1f(this.simple.u.uLayer, layer);
      gl.drawArrays(gl.TRIANGLES, from * 6, (to - from) * 6);
    };
    let i = 0;
    for (; i < Math.floor(n / 6); i++) {
      const layer = list[i].layer;
      if (layer !== curLayer) { flush(start, i, curLayer); start = i; curLayer = layer; }
    }
    flush(start, i, curLayer);
    gl.enable(gl.CULL_FACE);
    gl.disable(gl.BLEND);
  }

  /** Nuages : une nappe texturée qui dérive au-dessus du monde. */
  drawClouds(world, time) {
    const gl = this.gl;
    const y = 118;
    const size = 400;
    const drift = time * 0.6;
    const cx = Math.round(this.cam.x / 64) * 64;
    const cz = Math.round(this.cam.z / 64) * 64;
    const d = this.dynData;
    const tiles = 26;
    const step = (size * 2) / tiles;
    let n = 0;
    for (let i = 0; i < tiles; i++) {
      for (let j = 0; j < tiles; j++) {
        if (n + 6 > 4096) break;
        // Une case sur trois est vide : les nuages forment des amas irréguliers.
        const h = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453;
        if ((h - Math.floor(h)) < 0.42) continue;
        const x0 = cx - size + i * step, z0 = cz - size + j * step;
        const quad = [[x0, z0, 0, 0], [x0 + step, z0, 1, 0], [x0 + step, z0 + step, 1, 1],
          [x0, z0, 0, 0], [x0 + step, z0 + step, 1, 1], [x0, z0 + step, 0, 1]];
        for (const [qx, qz, qu, qv] of quad) {
          const o = n * 6;
          d[o] = qx + drift; d[o + 1] = y; d[o + 2] = qz;
          d[o + 3] = qu; d[o + 4] = qv; d[o + 5] = 1;
          n++;
        }
      }
    }
    gl.bindVertexArray(this.dynVAO);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.dynBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, d.subarray(0, n * 6));
    identity(this.model);
    gl.uniformMatrix4fv(this.simple.u.uModel, false, this.model);
    gl.uniform1i(this.simple.u.uTextured, 1);
    gl.uniform1f(this.simple.u.uLayer, T('cloud'));
    const b = world.skyBrightness();
    gl.uniform4f(this.simple.u.uColor, 1, 1, 1, 0.72);
    gl.uniform1f(this.simple.u.uLight, 0.35 + b * 0.65);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.CULL_FACE);
    gl.depthMask(false);
    gl.drawArrays(gl.TRIANGLES, 0, n);
    gl.depthMask(true);
    gl.enable(gl.CULL_FACE);
    gl.disable(gl.BLEND);
  }

  /** Vue « à la première personne » : l'objet tenu, dessiné par-dessus la scène. */
  drawHeldItem(draw, aspect) {
    const gl = this.gl;

const PASSIVE = ['pig', 'cow', 'sheep', 'chicken'];
const HOSTILE = ['zombie', 'skeleton', 'creeper', 'spider'];

/* ──────────────────────────── Créatures ──────────────────────────── */

class Mob extends Entity {
  constructor(type, x, y, z) {
    super(x, y, z);
    const m = MOBS[type];
    this.type = type;
    this.def = m;
    this.width = m.width;
    this.height = m.height;
    this.hp = m.hp;
    this.maxHp = m.hp;
    this.hurtTime = 0;
    this.attackCd = 0;
    this.state = 'idle';
    this.stateTime = 0;
    this.limbSwing = 0;
    this.headYaw = 0;
    this.fuse = 0;
    this.burning = 0;
    this.sheared = false;
    this.wanderTarget = null;
    this.yaw = Math.random() * Math.PI * 2;
    this.eggTimer = 300 + Math.random() * 300;
  }

  get hostile() { return this.def.hostile; }

  update(dt, ctx) {
    this.age += dt;
    this.hurtTime = Math.max(0, this.hurtTime - dt);
    this.attackCd = Math.max(0, this.attackCd - dt);
    this.stateTime -= dt;

    const player = ctx.player;
    const dist = player && !player.dead ? this.distanceTo(player) : Infinity;

    // Disparition des créatures trop lointaines (comme dans le jeu).
    if (dist > 110) { this.dead = true; return; }
    // Les villageois ne disparaissent pas : leur village serait vide au retour.
    if (!this.def.sedentaire && dist > 40 && this.age > 30 && Math.random() < dt * 0.02) { this.dead = true; return; }

    this.think(dt, ctx, player, dist);
    this.applyMovement(dt, ctx);
    this.environment(dt, ctx);
  }

  /** Choix de la conduite : errer, poursuivre, attaquer, fuir. */
  think(dt, ctx, player, dist) {
    const d = this.def;
    const canSee = dist < 26 && this.hasLineOfSight(ctx.world, player);
    const nightTime = ctx.world.isNight();

    if (d.hostile && player && !player.dead && player.mode !== 'creative') {
      const range = this.type === 'spider' && !nightTime ? 8 : 20;
      if (dist < range && canSee) {
        this.state = 'chase';
        this.target = player;
      } else if (this.state === 'chase' && dist > 32) this.state = 'idle';
    } else if (this.state === 'flee' && this.stateTime <= 0) this.state = 'idle';

    if (this.state === 'chase' && this.target) {
      this.faceTo(this.target.x, this.target.z);
      const close = dist < (this.width + this.target.width) / 2 + 0.6;

      if (d.explodes) {
        if (dist < 3.2) {
          this.fuse += dt;
          this.moveForward = dist > 1.6 ? 0.3 : 0;
          if (this.fuse > 1.5) {
            this.dead = true;
            explode(ctx, this.x, this.y + 0.8, this.z, 3.2);
          }
        } else { this.fuse = Math.max(0, this.fuse - dt * 0.5); this.moveForward = 1; }
        return;
      }

      if (d.ranged) {
        this.moveForward = dist > 9 ? 1 : dist < 4 ? -0.6 : 0.25;
        if (this.attackCd <= 0 && dist < 16 && dist > 2) {
          this.shootArrow(ctx, this.target);
          this.attackCd = 1.8 + Math.random() * 0.6;
        }
        return;
      }

      this.moveForward = close ? 0 : 1;
      if (close && this.attackCd <= 0) {
        this.target.hurt(d.damage, 'mob', ctx, this);
        this.attackCd = 1;
        ctx.sound?.('hurt', this);
      }
      return;
    }

    // Flânerie
    this.moveForward = 0;
    if (this.stateTime <= 0) {
      this.stateTime = 2 + Math.random() * 5;
      if (Math.random() < 0.55) {
        this.state = 'wander';
        this.yaw += (Math.random() - 0.5) * 2.6;
      } else this.state = 'idle';
    }
    if (this.state === 'wander' || this.state === 'flee') this.moveForward = this.state === 'flee' ? 1.35 : 0.65;
  }

  faceTo(x, z) {
    const target = Math.atan2(-(x - this.x), z - this.z);
    let diff = target - this.yaw;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    this.yaw += Math.max(-0.25, Math.min(0.25, diff));
  }

  hasLineOfSight(world, other) {
    if (!other) return false;
    const ox = this.x, oy = this.y + this.def.eye, oz = this.z;
    const dx = other.x - ox, dy = (other.y + other.height * 0.8) - oy, dz = other.z - oz;
    const len = Math.hypot(dx, dy, dz);
    if (len < 0.1) return true;
    const hit = world.raycast(ox, oy, oz, dx / len, dy / len, dz / len, Math.min(len, 30));
    return !hit || hit.dist >= len - 0.6;
  }

  shootArrow(ctx, target) {
    const ox = this.x, oy = this.y + this.def.eye - 0.2, oz = this.z;
    const dx = target.x - ox;
    const dy = (target.y + target.height * 0.6) - oy;
    const dz = target.z - oz;
    const len = Math.hypot(dx, dy, dz);
    const speed = 24;
    const spread = 0.04;
    const a = new Arrow(ox, oy, oz,
      (dx / len) * speed + (Math.random() - 0.5) * spread * speed,
      (dy / len) * speed + len * 0.06 + (Math.random() - 0.5) * spread * speed,
      (dz / len) * speed + (Math.random() - 0.5) * spread * speed,
      this, 3);
    ctx.spawn(a);
    ctx.sound?.('bow', this);
  }

  applyMovement(dt, ctx) {
    const speed = this.def.speed * (this.state === 'flee' ? 1.4 : 1);
    // On vise directement la vitesse voulue : les créatures gèrent leur propre
    // « frottement », sinon celui du sol les immobiliserait presque.
    if (this.moveForward) {
      const s = speed * this.moveForward;
      const tvx = -Math.sin(this.yaw) * s;
      const tvz = Math.cos(this.yaw) * s;
      const k = Math.min(1, dt * (this.onGround ? 14 : 3));
      this.vx += (tvx - this.vx) * k;
      this.vz += (tvz - this.vz) * k;
      this.limbSwing += Math.hypot(this.vx, this.vz) * dt * 2.4;
    } else {
      const k = Math.min(1, dt * 12);
      this.vx -= this.vx * k;
      this.vz -= this.vz * k;
      this.limbSwing += dt * 0.4;
    }

    const before = { x: this.x, z: this.z };
    const hit = this.physics(dt, ctx.world, { drag: 1, groundDrag: 1 });

    // Sauter par-dessus un obstacle d'un bloc, ou grimper (araignée).
    if ((hit.x || hit.z) && this.moveForward) {
      if (this.def.climbs) this.vy = 3.2;
      else if (this.onGround) {
        const fx = this.x - Math.sin(this.yaw) * 0.6;
        const fz = this.z + Math.cos(this.yaw) * 0.6;
        const feet = ctx.world.getBlock(Math.floor(fx), Math.floor(this.y), Math.floor(fz));
        const head = ctx.world.getBlock(Math.floor(fx), Math.floor(this.y + 1.2), Math.floor(fz));
        if (BLOCKS[feet].solid && !BLOCKS[head].solid) this.vy = 7.6;
        else if (Math.random() < 0.1) this.yaw += (Math.random() - 0.5) * 2;
      }
    }
    if (this.inWater && this.vy < 1.5) this.vy += 12 * dt;
    if (this.def.float && this.vy < -1.5) this.vy = -1.5;

    // Éviter de tomber d'une falaise sans raison.
    if (this.onGround && this.moveForward && this.state !== 'chase') {
      const fx = Math.floor(this.x - Math.sin(this.yaw) * 0.8);
      const fz = Math.floor(this.z + Math.cos(this.yaw) * 0.8);
      let drop = 0;
      for (let dy = 1; dy <= 4; dy++) {
        if (BLOCKS[ctx.world.getBlock(fx, Math.floor(this.y) - dy, fz)].solid) break;
        drop = dy;
      }
      if (drop >= 3) { this.x = before.x; this.z = before.z; this.yaw += 2.2; this.vx = this.vz = 0; }
    }
  }

  /** Feu du jour, noyade, dégâts de chute, cactus, lave. */
  environment(dt, ctx) {
    const world = ctx.world;
    if (this.def.burnsInSun && world.isDay() && !this.inWater) {
      const sky = world.getSkyLight(Math.floor(this.x), Math.floor(this.y + this.height * 0.8), Math.floor(this.z));
      if (sky >= 14 && world.skyBrightness() > 0.6) {
        this.burning = Math.max(this.burning, 1);
      }
    }
    if (this.burning > 0) {
      this.burning -= dt;
      this.burnTick = (this.burnTick || 0) + dt;
      if (this.burnTick > 1) { this.burnTick = 0; this.hurt(1, ctx, null); }
      ctx.particles?.flame(this.x, this.y + this.height * 0.6, this.z, 1);
    }
    const feet = BLOCKS[world.getBlock(Math.floor(this.x), Math.floor(this.y + 0.2), Math.floor(this.z))];
    if (feet.hurt) {
      this.envTick = (this.envTick || 0) + dt;
      if (this.envTick > 0.5) { this.envTick = 0; this.hurt(feet.hurt, ctx, null); if (feet.fluid === 'lava') this.burning = 6; }
    }
    if (this.type === 'chicken' && !this.def.hostile) {
      this.eggTimer -= dt;
      if (this.eggTimer <= 0) {
        this.eggTimer = 300 + Math.random() * 300;
        ctx.dropItem?.(this.x, this.y + 0.3, this.z, { item: 'egg', count: 1, dmg: 0 });
      }
    }
  }

  onLand(fallDistance) {
    if (fallDistance > 3.5) this.pendingFallDamage = Math.floor(fallDistance - 3);
  }

  hurt(amount, ctx, source) {
    if (this.dead || this.hurtTime > 0.25) return;
    this.hp -= amount;
    this.hurtTime = 0.5;
    ctx.sound?.('hurt', this);
    ctx.particles?.damage(this.x, this.y + this.height * 0.6, this.z);
    if (source) {
      const dx = this.x - source.x, dz = this.z - source.z;
      const n = Math.hypot(dx, dz) || 1;
      this.vx += (dx / n) * 5.5; this.vz += (dz / n) * 5.5; this.vy = Math.max(this.vy, 4.2);
    }
    if (!this.def.hostile) {
      this.state = 'flee';
      this.stateTime = 4;
      if (source) this.yaw = Math.atan2(-(this.x - source.x), this.z - source.z);
    } else if (source && this.state !== 'chase') {
      this.state = 'chase';
      this.target = source;
    }
    if (this.hp <= 0) this.die(ctx, source);
  }

  die(ctx, source) {
    this.dead = true;
    ctx.sound?.('death', this);
    ctx.particles?.death(this.x, this.y + this.height * 0.5, this.z, this.def.parts[0].color);
    for (const d of this.def.drops) {
      if (d.chance !== undefined && Math.random() > d.chance) continue;
      const n = d.min + Math.floor(Math.random() * (d.max - d.min + 1));
      if (n > 0) {
        let item = d.item;
        // Le feu cuit la viande, comme dans le jeu.
        if (this.burning > 0) {
          const cooked = { porkchop: 'cooked_porkchop', beef: 'cooked_beef', chicken: 'cooked_chicken', mutton: 'cooked_mutton' };
          if (cooked[item]) item = cooked[item];
        }
        ctx.dropItem?.(this.x, this.y + this.height * 0.4, this.z, { item, count: n, dmg: 0 });
      }
    }
    if (this.type === 'sheep' && !this.sheared) {
      ctx.dropItem?.(this.x, this.y + 0.5, this.z, { item: 'wool_white', count: 1, dmg: 0 });
    }
    const [xmin, xmax] = this.def.xp;
    const xp = xmin + Math.floor(Math.random() * (xmax - xmin + 1));
    if (xp > 0) ctx.spawnXP?.(this.x, this.y + 0.5, this.z, xp);
  }
}

/* ────────────────────────── Apparition naturelle ────────────────────────── */

/**
 * L'emplacement convient-il à une créature terrestre ?
 * Il faut un sol solide et sec, et deux blocs libres au-dessus : sans le test
 * des fluides, les monstres apparaissaient au fond de l'eau, la mer étant
 * « non solide » pour le calcul de hauteur.
 */
function placeLibre(world, x, y, z) {
  const sol = BLOCKS[world.getBlock(x, y - 1, z)];
  if (!sol.solid || sol.fluid) return false;
  for (const dy of [0, 1]) {
    const b = BLOCKS[world.getBlock(x, y + dy, z)];
    if (b.solid || b.fluid) return false;
  }
  return true;
}

/**
 * Fait apparaître des créatures autour du joueur, avec les règles du jeu :
 * les hostiles dans le noir, les paisibles sur l'herbe en pleine lumière.
 */
function spawnCycle(ctx) {
  const { world, player, entities } = ctx;
  let hostiles = 0, passives = 0;
